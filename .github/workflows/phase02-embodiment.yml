name: phase02-embodiment-r03

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  embodiment-r03:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned proof tools
        run: python3 -m pip install --disable-pip-version-check --no-input 'Pillow==11.3.0' 'jsonschema==4.25.1'
      - name: Verify native approved references
        run: |
          set -euo pipefail
          test "$(sha256sum assets/source/p02/references/identity-approved.png | awk '{print $1}')" = 86ce1f9428f9a998d57e1a99c4245347d5a05e9f0bcf853c2b68065f351bdb56
          test "$(sha256sum assets/source/p02/references/turnaround-approved.png | awk '{print $1}')" = 3696c7d63594de38d408438d5b882f3207635bc63e59fb270f624715faeb09e4
      - name: Fetch and verify exact SQLite 3.53.4 source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sqlite"
          curl --fail --location --retry 3 https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip -o "$RUNNER_TEMP/sqlite/sqlite.zip"
          unzip -q "$RUNNER_TEMP/sqlite/sqlite.zip" -d "$RUNNER_TEMP/sqlite"
          test "$(sha256sum "$RUNNER_TEMP/sqlite/sqlite-amalgamation-3530400/sqlite3.c" | awk '{print $1}')" = "b1dd5d74ec7f29055a6684fa06fb3c2f6821c87dd38f9a458dfd2e8a1db28189"
          echo "COMPANION_SQLITE_SOURCE=$RUNNER_TEMP/sqlite/sqlite-amalgamation-3530400/sqlite3.c" >> "$GITHUB_ENV"
      - name: Rust foundation regression
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          test -f "$COMPANION_SQLITE_SOURCE"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build R03 articulated proof twice in clean processes
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/proof-a"; B="$RUNNER_TEMP/proof-b"
          python3 experiments/p02-embodiment/scripts/build_r03_motion.py --out "$A" --clean
          python3 experiments/p02-embodiment/scripts/build_r03_motion.py --out "$B" --clean
          diff -rq "$A" "$B"
          python3 experiments/p02-embodiment/scripts/validate_r03_motion.py --out "$A" --tamper-negative > "$RUNNER_TEMP/r03-validation.json"
          mkdir -p godot/assets/p02-r03
          cp -a "$A"/. godot/assets/p02-r03/
      - name: Validate proof schema and contracts
        run: |
          set -euo pipefail
          python3 scripts/validate_schemas.py
          python3 experiments/p02-embodiment/scripts/validate_r03_motion.py --out "$RUNNER_TEMP/proof-a" > /dev/null
          python3 scripts/check_contract_types.py
          PATH="$HOME/.cargo/bin:$PATH" python3 scripts/contract_closeout.py
      - name: Verify Godot 4.7.2 headless proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/godot.zip"
          test "$(sha256sum "$RUNNER_TEMP/godot/godot.zip" | awk '{print $1}')" = cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"; chmod +x "$GODOT"
          "$GODOT" --headless --path godot --editor --quit
          "$GODOT" --headless --path godot --script res://r03_temporal_playback_test.gd -- --out="$RUNNER_TEMP/proof-a" > "$RUNNER_TEMP/godot-r03.log"
          ! grep -q 'ERROR:' "$RUNNER_TEMP/godot-r03.log"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/godot-r03.log"
      - name: Check proof-tree policy
        run: |
          set -euo pipefail
          ! git ls-files -z assets/generated/p02 godot/assets/p02 | grep -z .
          python3 - <<'PY'
          from pathlib import Path
          total=sum(p.stat().st_size for p in Path('assets/source/p02').rglob('*') if p.is_file())
          assert total < 100*1024*1024, total
          PY
      - name: Upload named R03 motion-review artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: phase02-embodiment-r03-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proof-a
            assets/source/p02/r03/review
            experiments/p02-embodiment/results/r03
            assets/source/p02/reference_manifest.json
          if-no-files-found: error
