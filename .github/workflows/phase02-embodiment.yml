name: phase02-canon-motion-proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  canon-motion-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned proof tools
        run: python3 -m pip install --disable-pip-version-check --no-input 'Pillow==11.3.0' 'jsonschema==4.25.1'
      - name: Verify native approved references
        run: |
          set -euo pipefail
          test "$(sha256sum assets/source/p02/references/identity-approved.png | awk '{print $1}')" = 86ce1f9428f9a998d57e1a99c4245347d5a05e9f0bcf853c2b68065f351bdb56
          test "$(sha256sum assets/source/p02/references/turnaround-approved.png | awk '{print $1}')" = 3696c7d63594de38d408438d5b882f3207635bc63e59fb270f624715faeb09e4
      - name: Rust foundation regression
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build proof twice in clean processes
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/proof-a"; B="$RUNNER_TEMP/proof-b"
          python3 experiments/p02-embodiment/scripts/build_motion_proof.py --out "$A" --clean
          python3 experiments/p02-embodiment/scripts/build_motion_proof.py --out "$B" --clean
          diff -rq "$A" "$B"
          python3 - "$A/manifest.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          assert manifest["drawings"] == 26
          assert manifest["tracks"] == 6
          assert manifest["unique_drawings"] >= 12
          PY
          mkdir -p godot/assets/p02-core
          cp -a "$A"/. godot/assets/p02-core/
      - name: Validate proof schema and contracts
        run: |
          set -euo pipefail
          python3 scripts/validate_schemas.py
          PATH="$HOME/.cargo/bin:$PATH" python3 scripts/contract_closeout.py
      - name: Verify Godot 4.7.2 headless proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/godot.zip"
          test "$(sha256sum "$RUNNER_TEMP/godot/godot.zip" | awk '{print $1}')" = cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"; chmod +x "$GODOT"
          "$GODOT" --headless --path godot --editor --quit
          "$GODOT" --headless --path godot --script res://p02_temporal_headless_test.gd
      - name: Check proof-tree policy
        run: |
          set -euo pipefail
          ! git ls-files -z assets/generated/p02 godot/assets/p02 | grep -z .
          python3 - <<'PY'
          from pathlib import Path
          total=sum(p.stat().st_size for p in Path('assets/source/p02').rglob('*') if p.is_file())
          assert total < 100*1024*1024, total
          PY
      - name: Upload named canon and motion proof artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: phase02-canon-motion-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proof-a
            assets/source/p02/canon
            assets/source/p02/review/r02
            assets/source/p02/reference_manifest.json
          if-no-files-found: error
